# PR とmain への push で走る検証。
# 公開リポジトリ（tomo235789/ai-repertoire）では status: public 以外のカードを失敗にする。
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cards:
    name: カード検証と生成
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: validate_cards.py
        run: python scripts/validate_cards.py ${{ github.repository == 'tomo235789/ai-repertoire' && '--public-only' || '' }}
      - name: build_reference.py（生成が壊れていないことを確認）
        run: python scripts/build_reference.py

  typescript:
    name: typescript/examples (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: python/examples (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest と ruff（python/examples が無ければスキップ）
        run: |
          if [ -d python/examples ]; then
            pip install -r python/requirements.txt
            ruff check --config python/lint/ruff.toml python/examples
            cd python && pytest -q
          else
            echo "python/examples が無いためスキップ"
          fi

  go:
    name: go/examples (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go/go.sum
      - name: go test（go/examples が無ければスキップ）
        run: |
          if [ -d go/examples ]; then cd go && go vet ./... && go test ./...; else echo "go/examples が無いためスキップ"; fi

  csharp:
    name: csharp/examples (dotnet test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: dotnet test（csharp/examples が無ければスキップ）
        run: |
          if [ -d csharp/examples ]; then cd csharp/examples && dotnet test --nologo; else echo "csharp/examples が無いためスキップ"; fi

  react:
    name: react/examples (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: vitest（react/examples が無ければスキップ）
        run: |
          if [ -d examples ]; then npm ci && npm run typecheck && npm test; else echo "react/examples が無いためスキップ"; fi

  cpp:
    name: cpp/examples (g++ -std=c++23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: g++-14（cpp/examples が無ければスキップ。std::ranges::to は GCC 14 以降）
        run: |
          if [ -d cpp/examples ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq g++-14
            CXX=g++-14 cpp/run_tests.sh
          else
            echo "cpp/examples が無いためスキップ"
          fi

  ruby:
    name: ruby/examples (minitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: minitest（ruby/examples が無ければスキップ）
        run: |
          if [ -d ruby/examples ]; then ruby/run_tests.sh; else echo "ruby/examples が無いためスキップ"; fi

  rust:
    name: rust/tests (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test（rust/tests が無ければスキップ）
        run: |
          if [ -d rust/tests ]; then cd rust && cargo test --quiet; else echo "rust/tests が無いためスキップ"; fi

  sql:
    name: sql/examples (pytest, sqlite + duckdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest（sql/examples が無ければスキップ）
        run: |
          if [ -d sql/examples ]; then pip install -r sql/requirements.txt && cd sql && pytest -q; else echo "sql/examples が無いためスキップ"; fi

  terraform:
    name: terraform/modules (validate + tflint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - name: terraform（terraform/modules が無ければスキップ）
        run: |
          if [ -d terraform/modules ]; then cd terraform && tflint --init && ./run_tests.sh; else echo "terraform/modules が無いためスキップ"; fi

  aws:
    name: aws/examples (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest（aws/examples が無ければスキップ）
        run: |
          if [ -d aws/examples ]; then pip install -r aws/requirements.txt && cd aws && pytest -q; else echo "aws/examples が無いためスキップ"; fi
